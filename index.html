<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shootout</title>
    <meta
      name="description"
      content="A five-shot penalty shootout: aim with the mouse, hold and release to strike."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Shootout</h1>
      <div id="pitch" class="pitch">
        <div id="goal" class="goal">
          <div class="net"></div>
          <div id="keeper" class="keeper">
            <div class="keeper-body"></div>
          </div>
        </div>
        <div id="reticle" class="reticle" aria-hidden="true"></div>
        <div id="ball" class="ball"></div>
        <div id="power-meter" class="power-meter" aria-hidden="true">
          <div class="power-zones"></div>
          <div id="power-marker" class="power-marker"></div>
        </div>
        <div id="scoreboard" class="scoreboard" aria-live="polite">
          <div class="score-row score-row--red" id="row-0">
            <span class="score-name" id="name-0"></span>
            <div class="pips" id="pips-0"></div>
          </div>
          <div class="score-row score-row--blue" id="row-1">
            <span class="score-name" id="name-1"></span>
            <div class="pips" id="pips-1"></div>
          </div>
        </div>
        <div id="end-screen" class="end-screen hidden"></div>
        <form id="name-screen" class="name-screen">
          <input
            id="name-input-0"
            class="name-input name-input--red"
            maxlength="12"
            autocomplete="off"
            spellcheck="false"
            aria-label="First player, red"
          />
          <input
            id="name-input-1"
            class="name-input name-input--blue"
            maxlength="12"
            autocomplete="off"
            spellcheck="false"
            aria-label="Second player, blue"
          />
          <button type="submit" class="start-button" aria-label="Start the shootout"></button>
        </form>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
