<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shootout</title>
    <meta
      name="description"
      content="A five-shot penalty shootout: aim with the mouse, hold and release to strike."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Shootout</h1>
      <div id="pitch" class="pitch">
        <div id="goal" class="goal">
          <div id="keeper" class="keeper"></div>
        </div>
        <div id="reticle" class="reticle" aria-hidden="true"></div>
        <div id="ball" class="ball"></div>
        <div id="power-meter" class="power-meter" aria-hidden="true">
          <div id="power-fill" class="power-fill"></div>
        </div>
        <div id="scoreboard" class="scoreboard" aria-live="polite"></div>
        <div id="end-screen" class="end-screen hidden"></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
